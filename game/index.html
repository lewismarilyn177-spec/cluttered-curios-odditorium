<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cluttered Curios: Night at the Odditorium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div id="levelName">Odditorium — Gallery I</div>
    <div id="scoreWrap">
      <span class="label">Score</span>
      <span id="scoreVal">0</span>
    </div>
    <div id="streakWrap">
      <span class="label">Streak</span>
      <span id="streakVal">0</span>
    </div>
    <div id="timerWrap">
      <div id="timerBar"></div>
    </div>
    <button id="hintBtn" type="button" aria-label="Use hint">
      <span id="hintIcon">💡</span>
      <span id="hintCount">3</span>
    </button>
    <button id="muteBtn" type="button" aria-label="Toggle sound">
      <span id="muteIcon">🔊</span>
    </button>
  </header>

  <section id="stage">
    <div id="panels">
      <canvas id="panelL" width="1000" height="600" aria-label="Left panel - original scene"></canvas>
      <canvas id="panelR" width="1000" height="600" aria-label="Right panel - altered scene"></canvas>
    </div>
    <div id="counter">Differences found: <span id="foundCount">0</span> / <span id="totalCount">5</span></div>
    <div id="hintline">Click a difference on either panel. Hints reveal a mismatch.</div>
  </section>

  <div id="toast" aria-live="polite"></div>

  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
    <div class="overlay-content">
      <h1 id="overlayTitle">Cluttered Curios: Night at the Odditorium</h1>
      <p id="overlayText">Spot the differences between the two curious displays. Find all 5 before time runs out.</p>
      <button id="startBtn" type="button">Begin Night Watch</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
